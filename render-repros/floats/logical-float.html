<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>float logical-float</title>
<style>
html, body { margin: 0; }
body { font: 16px/20px 'Liberation Sans', Arial, sans-serif; }
.c { width: 400px; background: #f1f3f5; }
.l { float: left; } .r { float: right; }
.a { background: #087f5b; } .b { background: #1971c2; } .d { background: #e8590c; } .e { background: #862e9c; }
p { margin: 0; }

</style>
</head>
<body>
<div class=c id=c><div class=a id=f1 style="float:inline-start;width:100px;height:40px"></div><div class=b id=f2 style="float:inline-end;width:100px;height:40px"></div><div id=k style="clear:inline-start;height:10px;background:#ccc"></div></div>
</body>
</html>
