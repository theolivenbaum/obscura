<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>float percent-width</title>
<style>
html, body { margin: 0; }
body { font: 16px/20px 'Liberation Sans', Arial, sans-serif; }
.c { width: 400px; background: #f1f3f5; }
.l { float: left; } .r { float: right; }
.a { background: #087f5b; } .b { background: #1971c2; } .d { background: #e8590c; } .e { background: #862e9c; }
p { margin: 0; }

</style>
</head>
<body>
<div class=c id=c><div class="l a" id=f1 style="width:25%;height:30px"></div><div class="l b" id=f2 style="width:50%;height:30px;padding:0 5px;box-sizing:border-box"></div><div class="r d" id=f3 style="width:20%;height:40px"></div></div>
</body>
</html>
