<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>float clearfix-after</title>
<style>
html, body { margin: 0; }
body { font: 16px/20px 'Liberation Sans', Arial, sans-serif; }
.c { width: 400px; background: #f1f3f5; }
.l { float: left; } .r { float: right; }
.a { background: #087f5b; } .b { background: #1971c2; } .d { background: #e8590c; } .e { background: #862e9c; }
p { margin: 0; }
.cf::after { content: ""; display: table; clear: both; }
</style>
</head>
<body>
<div class="c cf" id=c><div class="l a" id=f1 style="width:100px;height:60px"></div><div class="r b" id=f2 style="width:100px;height:80px"></div></div><p id=p>next</p>
</body>
</html>
