<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>float nav-bar</title>
<style>
html, body { margin: 0; }
body { font: 16px/20px 'Liberation Sans', Arial, sans-serif; }
.c { width: 400px; background: #f1f3f5; }
.l { float: left; } .r { float: right; }
.a { background: #087f5b; } .b { background: #1971c2; } .d { background: #e8590c; } .e { background: #862e9c; }
p { margin: 0; }
ul.nav { list-style:none; margin:0; padding:0; background:#333; overflow:hidden; } ul.nav li { float:left; } ul.nav a { display:block; padding:10px 15px; color:#fff; }
</style>
</head>
<body>
<div class=c id=c><ul class=nav id=nav><li id=li1><a id=a1>Home</a></li><li id=li2><a id=a2>About us</a></li><li id=li3 style="float:right"><a id=a3>Contact</a></li></ul><p id=p><span id=s1>Lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua</span></p></div>
</body>
</html>
