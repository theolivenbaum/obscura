<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>float columns-layout</title>
<style>
html, body { margin: 0; }
body { font: 16px/20px 'Liberation Sans', Arial, sans-serif; }
.c { width: 400px; background: #f1f3f5; }
.l { float: left; } .r { float: right; }
.a { background: #087f5b; } .b { background: #1971c2; } .d { background: #e8590c; } .e { background: #862e9c; }
p { margin: 0; }
.col { float:left; width:33.3333%; box-sizing:border-box; padding:5px; }
</style>
</head>

</html>
