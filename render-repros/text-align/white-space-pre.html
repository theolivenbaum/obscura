<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>text-align white-space-pre</title>
<style>
html, body { margin: 0; }
body { font: 16px/20px 'Liberation Sans', sans-serif; }
.c { width: 300px; background: #f1f3f5; margin-bottom: 10px; }
.he { font-family: 'DejaVu Sans', sans-serif; }
.ib { display: inline-block; width: 40px; height: 12px; background: #1971c2; }
.r { float: right; } .l { float: left; }
.f { width: 60px; height: 30px; background: #087f5b; }
p { margin: 0; }

</style>
</head>
<body>
<div class=c id=c1 style="text-align:right;white-space:pre"><span id=a1>alpha beta   
gamma</span></div>
<div class=c id=c2 style="text-align:center;white-space:pre"><span id=b1>alpha beta   
gamma</span></div>
</body>
</html>
