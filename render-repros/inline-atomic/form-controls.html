<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>inline-atomic form-controls</title>
<style>
html, body { margin: 0; }
body { font: 16px/20px 'Liberation Sans', Arial, sans-serif; }
.c { width: 400px; background: #f1f3f5; }
p { margin: 0; }
.ib { display: inline-block; background: #a5d8ff; }
.l { float: left; } .r { float: right; }
.a { background: #087f5b; } .b { background: #1971c2; }

</style>
</head>
<body>
<div class=c id=c><p id=p><span id=s1>name</span> <input id=in value="text" size=8> <button id=bt>Go</button> <select id=se><option>one</option></select> <span id=s2>end</span></p></div>
</body>
</html>
