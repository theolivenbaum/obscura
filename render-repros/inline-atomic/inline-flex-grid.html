<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>inline-atomic inline-flex-grid</title>
<style>
html, body { margin: 0; }
body { font: 16px/20px 'Liberation Sans', Arial, sans-serif; }
.c { width: 400px; background: #f1f3f5; }
p { margin: 0; }
.ib { display: inline-block; background: #a5d8ff; }
.l { float: left; } .r { float: right; }
.a { background: #087f5b; } .b { background: #1971c2; }

</style>
</head>
<body>
<div class=c id=c><p id=p><span id=s1>flex</span> <span id=f style="display:inline-flex;gap:4px;background:#ffd8a8"><span id=f1>a</span><span id=f2>bb</span></span> <span id=s2>grid</span> <span id=g style="display:inline-grid;grid-template-columns:20px 20px;background:#d0bfff"><span id=g1>1</span><span id=g2>2</span><span id=g3>3</span></span> <span id=s3>end</span></p></div>
</body>
</html>
