<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>inline-atomic ib-text-baseline</title>
<style>
html, body { margin: 0; }
body { font: 16px/20px 'Liberation Sans', Arial, sans-serif; }
.c { width: 400px; background: #f1f3f5; }
p { margin: 0; }
.ib { display: inline-block; background: #a5d8ff; }
.l { float: left; } .r { float: right; }
.a { background: #087f5b; } .b { background: #1971c2; }

</style>
</head>
<body>
<div class=c id=c><p id=p><span id=s1>before</span> <span class=ib id=ib>inside</span> <span id=s2>after</span> <span class=ib id=ib2 style="font-size:30px">big</span> <span id=s3>end</span></p></div>
</body>
</html>
