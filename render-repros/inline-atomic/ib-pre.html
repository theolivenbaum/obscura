<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>inline-atomic ib-pre</title>
<style>
html, body { margin: 0; }
body { font: 16px/20px 'Liberation Sans', Arial, sans-serif; }
.c { width: 400px; background: #f1f3f5; }
p { margin: 0; }
.ib { display: inline-block; background: #a5d8ff; }
.l { float: left; } .r { float: right; }
.a { background: #087f5b; } .b { background: #1971c2; }
.ib { width: 30px; height: 18px; }
</style>
</head>
<body>
<div class=c id=c><p id=p style="white-space:pre"><span id=s1>a  b</span>  <span class=ib id=ib1></span>  <span id=s2>c</span></p></div>
</body>
</html>
