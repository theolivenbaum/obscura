<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>inline-atomic span-around-ib</title>
<style>
html, body { margin: 0; }
body { font: 16px/20px 'Liberation Sans', Arial, sans-serif; }
.c { width: 400px; background: #f1f3f5; }
p { margin: 0; }
.ib { display: inline-block; background: #a5d8ff; }
.l { float: left; } .r { float: right; }
.a { background: #087f5b; } .b { background: #1971c2; }

</style>
</head>
<body>
<div class=c id=c><p id=p><span id=s1>a</span> <span id=sp style="border:1px solid #333;padding:0 3px">in <span class=ib id=ib style="width:40px;height:25px"></span> span</span> <span id=s2>b</span></p></div>
</body>
</html>
