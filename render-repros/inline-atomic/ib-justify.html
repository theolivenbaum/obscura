<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>inline-atomic ib-justify</title>
<style>
html, body { margin: 0; }
body { font: 16px/20px 'Liberation Sans', Arial, sans-serif; }
.c { width: 400px; background: #f1f3f5; }
p { margin: 0; }
.ib { display: inline-block; background: #a5d8ff; }
.l { float: left; } .r { float: right; }
.a { background: #087f5b; } .b { background: #1971c2; }
.ib { width: 50px; height: 18px; }
</style>
</head>
<body>
<div class=c id=c><p id=p style="text-align:justify"><span id=s1>Lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor</span> <span class=ib id=ib1></span> <span id=s2>more words here</span> <span class=ib id=ib2></span> <span id=s3>and the last line</span></p></div>
</body>
</html>
