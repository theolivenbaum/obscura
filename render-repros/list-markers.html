<!doctype html><html><head><meta charset="utf-8"><title>list markers</title><style>
html, body { margin: 0; background: #fff; }
body { font: 32px/40px 'Liberation Sans'; }
ul, ol { margin: 0 0 0 0; }
li { color: #000; }
li span { color: transparent; }
.box { width: 500px; }
</style></head><body>
<div class=box><ul id=u1><li><span>disc</span></li></ul>
<ol id=o1><li><span>decimal</span></li></ol>
<ul id=u2 style="list-style-position:inside"><li><span>inside</span></li></ul>
<ol id=o2 style="list-style-position:inside"><li><span>inside</span></li></ol>
<ul id=u3 dir=rtl><li><span>rtl</span></li></ul>
<ol id=o3 dir=rtl><li><span>rtl</span></li></ol>
<ul id=u4 style="list-style-type:square"><li><span>square</span></li></ul>
<ul id=u5 style="list-style-type:circle;font-size:16px;line-height:20px"><li><span>small</span></li></ul>
<ol id=o5 style="font-size:16px;line-height:20px" start=10><li><span>small</span></li></ol>
</div>
</body></html>
