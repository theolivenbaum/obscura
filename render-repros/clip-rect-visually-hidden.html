<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>clip: rect() on absolutely positioned boxes</title>
  <style>
    html, body { margin: 0; }
    .box { position: absolute; width: 100px; height: 60px; }
    /* msn.com's "Skip to footer" link: fixed and visually hidden until focused. */
    #hidden { position: fixed; left: 20px; top: 20px; clip: rect(0px, 0px, 0px, 0px); background: #e03131; }
    #hidden span { display: block; width: 200px; height: 20px; background: #f08c00; }
    #half { left: 160px; top: 20px; clip: rect(10px, 50px, auto, auto); background: #1971c2; }
    #half span { position: absolute; left: -40px; top: 40px; width: 200px; height: 40px; background: #087f5b; }
    #static { position: static; clip: rect(0 0 0 0); width: 100px; height: 40px; margin-top: 120px; background: #7048e8; }
  </style>
</head>
<body>
  <a id="hidden" class="box" href="#footer"><span>Skip to footer</span></a>
  <div id="half" class="box"><span></span></div>
  <div id="static"></div>
</body>
</html>
